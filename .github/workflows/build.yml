name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Regenerate clean android scaffolding
        run: |
          rm -rf android
          flutter create . --platforms android --org com --project-name manatsume
      - run: flutter pub get
      - name: Apply just_audio_background Android setup
        run: flutter pub run just_audio_background:install
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: Manatsume-APK
          path: build/app/outputs/flutter-apk/*.apk
