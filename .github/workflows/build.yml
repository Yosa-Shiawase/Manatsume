name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Regenerate clean android scaffolding
        run: |
          rm -rf android
          flutter create . --platforms android --org com --project-name manatsume

      - name: Apply just_audio_background manifest
        run: cp ci/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manatsume-APK
          path: build/app/outputs/flutter-apk/*.apk
